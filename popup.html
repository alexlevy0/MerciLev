<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Correcteur Français</title>
  <style>
    body {
      width: 300px;
      padding: 16px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #333;
    }
    
    h1 {
      font-size: 18px;
      margin: 0 0 16px 0;
      color: #1a1a1a;
    }
    
    .status {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-weight: 500;
    }
    
    .status.ok {
      background-color: #d1fae5;
      color: #065f46;
    }
    
    .status.error {
      background-color: #fee2e2;
      color: #991b1b;
    }
    
    .error-details {
      margin-top: 8px;
      font-size: 12px;
      font-weight: normal;
      line-height: 1.4;
    }
    
    button {
      width: 100%;
      padding: 10px 16px;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    
    button:hover {
      background-color: #2563eb;
    }
    
    button:active {
      background-color: #1d4ed8;
    }
    
    button:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }
    
    .info {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
      font-size: 12px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <h1>Correcteur Français</h1>
  
  <div id="status" class="status">
    <div id="statusText">Chargement...</div>
    <div id="errorDetails" class="error-details" style="display: none;"></div>
  </div>
  
  <button id="testButton">Tester connexion</button>
  
  <div class="info">
    Modèle : gemma3n:e4b<br>
    Endpoint : localhost:11434
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
