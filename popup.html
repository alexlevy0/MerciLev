<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Correcteur Français</title>
  <style>
    body {
      width: 300px;
      padding: 16px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #333;
    }
    
    h1 {
      font-size: 18px;
      margin: 0 0 16px 0;
      color: #1a1a1a;
    }
    
    .status {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-weight: 500;
    }
    
    .status.ok {
      background-color: #d1fae5;
      color: #065f46;
    }
    
    .status.error {
      background-color: #fee2e2;
      color: #991b1b;
    }
    
    .error-details {
      margin-top: 8px;
      font-size: 12px;
      font-weight: normal;
      line-height: 1.4;
    }
    
    button {
      width: 100%;
      padding: 10px 16px;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    
    button:hover {
      background-color: #2563eb;
    }
    
    button:active {
      background-color: #1d4ed8;
    }
    
    button:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }
    
    .info {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
      font-size: 12px;
      color: #6b7280;
    }
    
    .model-selector {
      margin-bottom: 16px;
    }
    
    .model-selector label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #4b5563;
      margin-bottom: 6px;
    }
    
    .model-selector select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 14px;
      background-color: white;
      cursor: pointer;
    }
    
    .model-selector select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    
    .model-info {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>Correcteur Français</h1>
  
  <div id="status" class="status">
    <div id="statusText">Chargement...</div>
    <div id="errorDetails" class="error-details" style="display: none;"></div>
  </div>
  
  <div class="model-selector">
    <label for="modelSelect">Modèle Ollama :</label>
    <select id="modelSelect">
      <option value="qwen2.5:3b">qwen2.5:3b (Nouveau)</option>
      <option value="gemma3n:e4b">gemma3n:e4b (Précis)</option>
      <option value="gemma3n:e2b">gemma3n:e2b (Rapide & Précis)</option>
      <option value="granite-embedding:278m">granite-embedding:278m (Ultra-léger)</option>
    </select>
    <div class="model-info">Le changement prendra effet immédiatement</div>
  </div>
  
  <button id="testButton">Tester connexion</button>
  
  <div class="info">
    <div id="currentModel">Modèle actuel : chargement...</div>
    Endpoint : localhost:11434
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
